<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 背景：濃い墨色 -->
  <rect width="512" height="512" fill="#2a1810"/>

  <!-- 装飾枠 -->
  <rect x="32" y="32" width="448" height="448" fill="none" stroke="#b8893f" stroke-width="6"/>
  <rect x="48" y="48" width="416" height="416" fill="none" stroke="#b8893f" stroke-width="2"/>

  <!-- 中央の盾 -->
  <path d="M 256 90
           L 380 130
           L 380 280
           Q 380 380 256 430
           Q 132 380 132 280
           L 132 130 Z"
        fill="#b8893f" stroke="#2a1810" stroke-width="6"/>

  <!-- 盾の内側装飾 -->
  <path d="M 256 110
           L 365 145
           L 365 275
           Q 365 365 256 410
           Q 147 365 147 275
           L 147 145 Z"
        fill="none" stroke="#2a1810" stroke-width="2"/>

  <!-- 剣（縦長） -->
  <g transform="translate(256, 260)">
    <!-- 剣身 -->
    <rect x="-8" y="-110" width="16" height="160" fill="#ede2c5" stroke="#2a1810" stroke-width="3"/>
    <polygon points="-8,-110 0,-130 8,-110" fill="#ede2c5" stroke="#2a1810" stroke-width="3"/>

    <!-- 鍔 -->
    <rect x="-40" y="46" width="80" height="14" fill="#7a5a25" stroke="#2a1810" stroke-width="3"/>
    <rect x="-50" y="48" width="100" height="3" fill="#2a1810"/>

    <!-- 柄 -->
    <rect x="-10" y="60" width="20" height="50" fill="#5e1010" stroke="#2a1810" stroke-width="3"/>
    <line x1="-10" y1="70" x2="10" y2="70" stroke="#2a1810" stroke-width="2"/>
    <line x1="-10" y1="80" x2="10" y2="80" stroke="#2a1810" stroke-width="2"/>
    <line x1="-10" y1="90" x2="10" y2="90" stroke="#2a1810" stroke-width="2"/>
    <line x1="-10" y1="100" x2="10" y2="100" stroke="#2a1810" stroke-width="2"/>

    <!-- 柄頭 -->
    <circle cx="0" cy="118" r="11" fill="#b8893f" stroke="#2a1810" stroke-width="3"/>
  </g>

  <!-- 上部の星章 -->
  <text x="256" y="80" text-anchor="middle" fill="#b8893f" font-size="32" font-family="serif" font-weight="900">✦</text>

  <!-- 下部に小さく "QB" -->
  <text x="256" y="478" text-anchor="middle" fill="#b8893f" font-size="20" font-family="serif" font-weight="900" letter-spacing="4">QUEST BOARD</text>
</svg>
